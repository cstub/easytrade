name: Build images to GHCR

# Builds every image the Helm chart deploys from one commit and pushes it to
# ghcr.io/<owner>/<repository>/<component>, tagged with the short commit SHA.
# Deploy with global.image.baseRepository=ghcr.io/<owner>/<repository> and
# global.image.tag=<short SHA>.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.tag.outputs.repository }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute base repository and tag
        id: tag
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: accountservice, context: src/accountservice }
          - { component: aggregator-service, context: src/aggregator-service }
          - { component: broker-service, context: src/broker-service }
          - { component: calculationservice, context: src/calculationservice }
          - { component: contentcreator, context: src/contentcreator }
          - { component: credit-card-order-service, context: src/credit-card-order-service }
          - { component: db, context: src/db }
          - { component: engine, context: src/engine }
          - { component: feature-flag-service, context: src/feature-flag-service }
          - { component: frontend, context: src/frontend }
          - { component: frontendreverseproxy, context: src/frontendreverseproxy }
          - { component: loadgen, context: src/loadgen }
          - { component: loginservice, context: src/loginservice }
          - { component: manager, context: src/manager/easyTradeManager }
          - { component: offerservice, context: src/offerservice }
          - { component: pricing-service, context: src/pricing-service }
          - { component: problem-operator, context: src/problem-operator }
          - { component: rabbitmq, context: src/rabbitmq }
          - { component: third-party-service, context: src/third-party-service }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ needs.tag.outputs.repository }}/${{ matrix.component }}:${{ needs.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_ORIGIN=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  summary:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Write summary
        env:
          REPOSITORY: ${{ needs.tag.outputs.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          {
            echo "### Images"
            echo
            echo "- Base repository: \`${REPOSITORY}\`"
            echo "- Tag: \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
